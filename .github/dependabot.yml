version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      ci-tools:
        patterns: ["*"]
      ci-tools-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      browser-tests:
        patterns: ["*"]
      browser-tests-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      python-build:
        patterns: ["*"]
      python-build-security:
        applies-to: security-updates
        patterns: ["*"]
