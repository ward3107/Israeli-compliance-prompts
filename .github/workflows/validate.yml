name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate templates and jurisdiction packs
        run: python3 scripts/validate.py
      - name: Test pack validation and prompt generation
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check reproducible examples
        run: python scripts/build_examples.py --check
      - name: Build static demo
        run: python scripts/build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test cookie consent behavior
        run: node --test tests/cookie-consent.test.cjs
