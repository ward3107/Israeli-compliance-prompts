name: validate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python scripts/check_dependencies.py
          python -m pip install --require-hashes -r requirements.txt
          python scripts/check_dependencies.py --installed
      - name: Validate templates and jurisdiction packs
        run: python3 scripts/validate.py
      - name: Test pack validation and prompt generation
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check reproducible examples
        run: python scripts/build_examples.py --check
      - name: Build static demo
        run: python scripts/build_site.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Test cookie consent behavior
        run: npm test
