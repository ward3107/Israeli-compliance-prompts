name: validate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Validate templates and jurisdiction packs
        run: python3 scripts/validate.py
      - name: Test pack validation and prompt generation
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check reproducible examples
        run: python scripts/build_examples.py --check
      - name: Build static demo
        run: python scripts/build_site.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Test cookie consent behavior
        run: npm test
