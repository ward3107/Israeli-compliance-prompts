name: browser
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python scripts/check_dependencies.py
          python -m pip install --require-hashes -r requirements.txt
          python scripts/check_dependencies.py --installed
      - run: npm audit --audit-level=low
      - run: npm test
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python scripts/build_examples.py --check
      - run: python scripts/build_site.py
      - name: Verify Pages artifact packaging before merge
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: pages-build-smoke
          path: generated/site
      - name: Test preview-first and offline experience
        run: npm run test:experience
      - name: Test customizer and downloaded packages
        run: node scripts/test-builder.cjs
      - name: Test guided setup and private review packages
        run: node scripts/test-guided.cjs
      - name: Test generated legal drafts and handoff packages
        run: node scripts/test-documents.cjs
      - name: Start disposable WordPress QA
        run: docker compose -p wct-guided-qa -f tests/wordpress.compose.yml up -d --wait
      - name: Initialize disposable WordPress
        run: docker compose -p wct-guided-qa -f tests/wordpress.compose.yml exec -T wordpress php /qa/install.php
      - name: Test real WordPress ZIP installation
        run: node scripts/test-wordpress.cjs
      - name: Remove disposable WordPress QA
        if: always()
        run: docker compose -p wct-guided-qa -f tests/wordpress.compose.yml down --volumes
      - name: Test browser interactions, accessibility and synthetic tracking
        run: npm run test:browser
      - name: Save reports and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-results
          path: test-results/
