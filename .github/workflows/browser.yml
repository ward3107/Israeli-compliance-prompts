name: browser
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: npm audit --audit-level=low
      - run: npm test
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python scripts/build_examples.py --check
      - run: python scripts/build_site.py
      - name: Test preview-first and offline experience
        run: npm run test:experience
      - name: Test customizer and downloaded packages
        run: node scripts/test-builder.cjs
      - name: Test guided setup and private review packages
        run: node scripts/test-guided.cjs
      - name: Test generated legal drafts and handoff packages
        run: node scripts/test-documents.cjs
      - name: Start disposable WordPress QA
        run: docker compose -p wct-guided-qa -f tests/wordpress.compose.yml up -d --wait
      - name: Initialize disposable WordPress
        run: docker compose -p wct-guided-qa -f tests/wordpress.compose.yml exec -T wordpress php /qa/install.php
      - name: Test real WordPress ZIP installation
        run: node scripts/test-wordpress.cjs
      - name: Remove disposable WordPress QA
        if: always()
        run: docker compose -p wct-guided-qa -f tests/wordpress.compose.yml down --volumes
      - name: Test browser interactions, accessibility and synthetic tracking
        run: npm run test:browser
      - name: Save reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results
          path: test-results/
