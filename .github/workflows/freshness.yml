name: freshness

# Legal citations rot: laws change and dates drift. This scheduled check fails
# (and opens a tracking issue) when any jurisdiction pack's last_reviewed is
# older than the freshness limit, so a re-check is a visible task rather than a
# warning nobody reads. It never touches the code — it only reports.

on:
  schedule:
    # 09:00 UTC on the 1st of every month.
    - cron: "0 9 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  # A pack not re-checked within this many days is considered stale.
  MAX_REVIEW_AGE_DAYS: "180"

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python scripts/check_dependencies.py
          python -m pip install --require-hashes -r requirements.txt
          python scripts/check_dependencies.py --installed

      - id: check
        name: Check citation freshness
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/validate.py --strict-stale "$MAX_REVIEW_AGE_DAYS" 2>&1 | tee freshness.log

      - name: Open or update a tracking issue when stale
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('freshness.log', 'utf8');
            // Only the freshness-limit lines — ignore any unrelated structural errors.
            const stale = log.split('\n').filter(l => l.includes('freshness limit'));
            if (stale.length === 0) {
              core.info('Check failed but no freshness-limit lines found; not opening an issue.');
              return;
            }
            const title = 'Jurisdiction packs need a freshness re-check';
            const marker = '<!-- freshness-guardrail -->';
            const body = [
              marker,
              `The scheduled freshness check found jurisdiction pack(s) whose \`last_reviewed\` is older than ${process.env.MAX_REVIEW_AGE_DAYS} days:`,
              '',
              '```',
              stale.join('\n'),
              '```',
              '',
              'Re-run a freshness pass on the flagged pack(s): verify each framework citation and effective date against current law, apply any fixes, then bump `last_reviewed`. See the **Getting it legally reviewed** section of the README.',
              '',
              `_Opened automatically by the \`freshness\` workflow — run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const found = existing.data.find(i => i.title === title && (i.body || '').includes(marker));
            if (found) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body,
              });
              core.info(`Updated existing issue #${found.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info(`Opened issue #${created.data.number}.`);
            }

      - name: Fail the run if stale
        if: steps.check.outcome == 'failure'
        run: |
          echo "Freshness check failed — see the log above and the tracking issue."
          exit 1
