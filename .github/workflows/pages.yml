name: pages
on:
  workflow_run:
    workflows: [browser]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - name: Require successful checks on the current main commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ref = context.payload.workflow_run.head_sha;
            // The separate CodeQL PR annotation check is not emitted for every
            // push. The analysis jobs enforce the SARIF severity gate themselves.
            const required = ['validate', 'browser', 'dependencies', 'codeql (javascript-typescript)', 'codeql (python)'];
            for (let attempt = 0; attempt < 30; attempt++) {
              const main = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
              if (main.data.object.sha !== ref) {
                core.setFailed('A newer main commit exists; refusing to publish an older build.');
                return;
              }
              const checks = await github.paginate(github.rest.checks.listForRef, {...context.repo, ref, filter: 'latest', per_page: 100});
              const chosen = required.map(name => checks.find(check => check.name === name));
              if (chosen.some(check => check && check.status === 'completed' && check.conclusion !== 'success')) {
                core.setFailed('A required validation or security check did not pass.');
                return;
              }
              if (chosen.every(check => check && check.status === 'completed' && check.conclusion === 'success')) return;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Required checks did not finish successfully within five minutes.');
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python scripts/check_dependencies.py
          python -m pip install --require-hashes -r requirements.txt
          python scripts/check_dependencies.py --installed
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: generated/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
