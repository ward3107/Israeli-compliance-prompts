<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>תצוגת הבאנר</title><link rel="stylesheet" href="cookie-consent.css"><style>
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:#f8fafc;color:#183348;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #d5e0e7;padding-bottom:16px;font-size:13px}.brand{display:flex;align-items:center;gap:8px;font-weight:700}.brand-mark{width:20px;height:20px;background:#183348;border-radius:6px 6px 6px 0}.demo-label{color:#486172}main{padding:34px 0;display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:center}h1{font-size:clamp(22px,5vw,34px);line-height:1.2;margin:0 0 14px}p{font-size:14px;line-height:1.8;margin:0;color:#486172}.visual{height:150px;position:relative;border-radius:70px 70px 14px 14px;background:#deeaee;overflow:hidden}.visual::before{content:"";position:absolute;width:95px;height:125px;background:#7695a3;border-radius:45px 45px 9px 9px;bottom:-20px;left:18px;transform:rotate(-18deg)}.visual::after{content:"";position:absolute;width:90px;height:90px;border:20px solid #f8fafc;border-radius:50%;top:-20px;right:-20px}.sample-tags{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}.sample-tags span{font-size:12px;padding:6px 10px;border:1px solid #c5d5df;border-radius:20px}footer{font-size:12px;padding-top:16px;border-top:1px solid #d5e0e7;color:#486172}@media(max-width:380px){body{padding:18px}main{grid-template-columns:1fr;gap:16px;padding:24px 0}.visual{display:none}.sample-tags{margin-top:12px}}
</style><style id="custom-style"></style></head><body><header><span class="brand"><span class="brand-mark" aria-hidden="true"></span>האתר שלכם</span><span class="demo-label">תצוגה לדוגמה</span></header><main><section><h1 id="sample-name">כאן מתחיל המותג שלכם.</h1><p>כל פרט משתלב באתר שלכם. בחרו צבעים, צורה ונוסח, וראו איך הבאנר נראה לצד התוכן.</p><div class="sample-tags" aria-hidden="true"><span>הסיפור שלנו</span><span>מה אנחנו עושים</span></div></section><div class="visual" aria-hidden="true"></div></main><footer>הבאנר פועל באמת. בתצוגה הזאת אין כלי מדידה או פרסום.</footer><script src="cookie-consent.js"></script><script src="preview.js"></script></body></html>
